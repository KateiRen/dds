title: Datadriven Solutions Hartlieb
name: Datadriven Solutions Hartlieb
email: hello@example.com
url: https://dds-hartlieb.github.io
description: Small business website project hosted with GitHub Pages.
locale: en-US
repository: kateiren/dds

remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: sunrise
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

masthead_title: "Datadriven Solutions"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

# Color settings (hex values)
color:
  primary-dark: "#000000"
  links: "#219ab3"

# Footer text
footer: Datadriven Solutions Hartlieb

# Social links used by the theme
social:
  - title: github
    url: https://github.com/kateiren/dds

markdown: kramdown
permalink: pretty
